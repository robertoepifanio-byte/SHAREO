# Smoke E2E iOS (simulador) — roda no CI via .github/workflows/ios-smoke.yml
# Valida os fluxos centrais do app no iOS: login → Home → Explorar → mapa Mapbox.
# Credenciais: conta demo de staging (scripts/_provision-test-owners.ts), via -e EMAIL/-e PASSWORD.
appId: com.shareo.app
---
- launchApp:
    clearState: true

# ── Login (app deslogado abre direto em /login — app/index.tsx) ──────────────
- assertVisible: "Entrar na sua conta"
- takeScreenshot: 01-login
- tapOn: "seu@email.com"
- inputText: ${EMAIL}
- tapOn: "Senha"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "Entrar"

# ── Home (tabs) ───────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Explorar"
    timeout: 30000
- takeScreenshot: 02-home
- scroll
- takeScreenshot: 03-home-scroll

# ── Explorar (lista de itens) ─────────────────────────────────────────────────
- tapOn: "Explorar"
- extendedWaitUntil:
    visible: "Ver no mapa"
    timeout: 15000
- takeScreenshot: 04-explorar
- scroll
- takeScreenshot: 05-explorar-itens

# ── Mapa nativo (Mapbox) ──────────────────────────────────────────────────────
- scrollUntilVisible:
    element: "Ver no mapa"
    direction: UP
- tapOn: "Ver no mapa"
# Prompt de localização do iOS, se aparecer
- tapOn:
    text: "Allow While Using App"
    optional: true
- tapOn:
    text: "Allow Once"
    optional: true
# Tempo para o Mapbox baixar os tiles
- extendedWaitUntil:
    notVisible: "Ver no mapa"
    timeout: 10000
- takeScreenshot: 06-mapa-mapbox
