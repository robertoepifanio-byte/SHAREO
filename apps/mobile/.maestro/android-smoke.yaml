# Smoke E2E Android (emulador) — roda no CI via .github/workflows/android-smoke.yml
# Valida os fluxos centrais do app no Android: login → Home → Explorar → mapa Mapbox.
# Credenciais: conta demo de staging (scripts/_provision-test-owners.ts), via -e EMAIL/-e PASSWORD.
appId: com.shareo.app
---
- launchApp:
    clearState: true

# ── Login (app deslogado abre direto em /login — app/index.tsx) ──────────────
- assertVisible: "Entrar na sua conta"
- takeScreenshot: 01-login
- tapOn: "seu@email.com"
- inputText: ${EMAIL}
# Mesma colisão de rótulo do smoke iOS: o accessibilityLabel "Senha" do campo
# colide com o rótulo visual "SENHA" acima — usar o placeholder em vez do label.
- tapOn: "••••••••"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "Entrar"

# ── Home (tabs) ───────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Explorar"
    timeout: 30000
- takeScreenshot: 02-home
- scroll
- takeScreenshot: 03-home-scroll

# ── Explorar (lista de itens) ─────────────────────────────────────────────────
- tapOn: "Explorar"
# accessibilityLabel do botão é "Ver itens no mapa" (explorar.tsx:423) — igual ao iOS
- extendedWaitUntil:
    visible: "Ver itens no mapa"
    timeout: 15000
- takeScreenshot: 04-explorar
- scroll
- takeScreenshot: 05-explorar-itens

# ── Mapa nativo (Mapbox) ──────────────────────────────────────────────────────
- scrollUntilVisible:
    element: "Ver itens no mapa"
    direction: UP
# Mesmo cuidado de timing do smoke iOS: esperar o momentum do scroll assentar
# antes do tap, senão cai no CategoryIcon errado.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Ver itens no mapa"
# Diálogo de permissão de localização do Android (texto do sistema, não do app)
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Only this time"
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
# Tempo para o Mapbox baixar os tiles
- extendedWaitUntil:
    notVisible: "Ver itens no mapa"
    timeout: 10000
- takeScreenshot: 06-mapa-mapbox
