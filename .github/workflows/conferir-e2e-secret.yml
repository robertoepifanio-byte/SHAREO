# Confere se o E2E_SECRET do GitHub bate com o do Vercel staging.
#
# 🪤 Por que existe: os dois valores são write-only — não dá para LER nenhum dos
# lados e comparar. Quando divergem, o sintoma é a suíte E2E reprovando com 429
# (o bypass de rate limit deixa de valer), e já custou 22 falhas fantasma numa
# rodada. Descobrir isso por uma suíte de ~20 min é caro; aqui são 3 segundos.
#
# Ninguém precisa ver o segredo: ele é injetado pelo próprio Actions e só o
# código HTTP da resposta é impresso.
#
# Disparo manual (Actions → "Conferir E2E_SECRET" → Run workflow).

name: Conferir E2E_SECRET

on:
  workflow_dispatch:

jobs:
  conferir:
    name: E2E_SECRET bate com o staging?
    runs-on: ubuntu-latest
    steps:
      - name: Perguntar ao staging
        env:
          E2E_SECRET:  ${{ secrets.E2E_SECRET }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${STAGING_URL:-https://staging.shareo.com.br}"
          ROTA="$BASE/api/test/mark-booking-paid"

          if [ -z "${E2E_SECRET:-}" ]; then
            echo "::error::E2E_SECRET não está definido nos GitHub Secrets deste repositório."
            exit 1
          fi

          # A rota tem três camadas (lib/e2eGuard.ts) e cada desfecho é um
          # diagnóstico diferente. O corpo vazio é de propósito: se o token
          # passar, a rota reprova na validação do bookingId — e é justamente
          # esse 400 que prova que as três camadas foram vencidas.
          CODIGO=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$ROTA" \
            -H 'content-type: application/json' \
            -H "x-e2e-token: $E2E_SECRET" \
            -d '{}')

          echo "Resposta do staging: HTTP $CODIGO"
          echo

          case "$CODIGO" in
            400)
              echo "✅ BATEM. O token venceu as três camadas e parou na validação"
              echo "   do corpo (bookingId obrigatório) — que é o esperado."
              ;;
            401)
              echo "::error::❌ DIVERGEM. O staging recusou o token."
              echo "Conserto: copiar o valor do GitHub Secret para a env E2E_SECRET"
              echo "do projeto no Vercel (escopo do staging) — ou o contrário — e"
              echo "REDEPLOYAR. Trocar env var no Vercel não afeta o runtime até o"
              echo "próximo deploy."
              exit 1
              ;;
            404)
              echo "::error::❌ O staging não tem E2E_SECRET, ou está com o"
              echo "kill-switch ligado (E2E_BYPASS_DISABLED=true). Não é divergência"
              echo "de valor: a rota se apaga antes de comparar o token."
              exit 1
              ;;
            *)
              echo "::error::Resposta inesperada ($CODIGO). Não dá para concluir."
              echo "Conferir se $BASE está no ar e se a rota existe neste deploy."
              exit 1
              ;;
          esac
