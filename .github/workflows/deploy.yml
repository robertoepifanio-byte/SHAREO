name: Deploy - ShareO

on:
  # Preview deploy: dispara em PR contra main — exceto PRs só de mobile/docs/agente
  # (preview Vercel só serve pro site web; mobile é validado por android/ios-smoke)
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "apps/mobile/**"
      - "docs/**"
      - "Documentos/**"
      - ".claude/**"
      - "**.md"
      - ".gitattributes"

  # Staging deploy (automático) e Production deploy (com aprovação):
  # ambos disparam em push na main OU em tags de release web (web-v*).
  # ⚠️ NÃO adicionar paths-ignore aqui: filtro de path não funciona de forma
  # confiável em push de TAG (quebraria o deploy de produção). O gate por
  # mudança-de-web do staging é feito pelo job "changes" abaixo.
  push:
    branches: [main]
    tags:
      # Convenção de release por plataforma (ADR-027): web-v* → produção web (este
      # workflow); mobile-v* → build EAS (eas-release.yml). Os prefixos não colidem.
      - "web-v*"

  # Disparo manual do job "production" — uso interno enquanto shareo.com.br fica
  # no placeholder (decisão do fundador, 2026-08-04). Web-v* segue reservado pro
  # go-live público real; workflow_dispatch é só pra testar o ambiente shareo-prd.
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 0: Detecta se o push na main tocou o SITE (fora de mobile/docs/agente).
  # Staging só redeploya quando o web muda. Fail-open: base indeterminada → deploya.
  # Roda só em push na main (em tag é pulado; production não depende dele).
  # ─────────────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -vE '^apps/mobile/|^docs/|^Documentos/|^\.claude/|\.md$|^\.gitattributes$' | grep -q .; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Preview Deploy — para cada PR
  # Gera uma URL de preview exclusiva para revisão visual antes do merge
  # ─────────────────────────────────────────────────────────────────
  preview:
    name: Preview Deploy (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Preview é POR PR e não roda migration nenhuma: aqui cancelar é certo.
    # Empurrar um commit novo torna o preview anterior obsoleto na hora.
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.preview-url }}
    permissions:
      pull-requests: write  # para comentar a URL no PR
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@54.6.1

      - name: Pull Vercel project config (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project (preview)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_STAGING }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING }}
          NEXT_PUBLIC_NOINDEX: "true"
          # DSN inlinado também no preview (o staging já fazia isso na linha ~214).
          # Sem isto o Sentry.init roda sem DSN e os eventos são capturados mas
          # nunca entregues — previews ficavam sem observabilidade. Sem
          # SENTRY_AUTH_TOKEN de propósito: não subir source maps a cada PR.
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Deploy preview to Vercel
        id: deploy
        run: |
          PREVIEW_URL=$(vercel deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview-url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.preview-url }}';
            const body = [
              '### Preview Deploy',
              '',
              'URL de preview gerada para este PR:',
              '',
              `**${url}**`,
              '',
              '_Valide as mudancas antes de aprovar o merge._'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Staging Deploy — automático após merge na main
  # Deploy no ambiente staging para validação pelo QA e ProductOwner
  # ─────────────────────────────────────────────────────────────────
  staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [changes]
    # Serializa os deploys de staging. Merges seguidos disparavam N deploys em
    # paralelo e o ALIAS do staging ficava com o ÚLTIMO a terminar — que não é
    # necessariamente o commit mais novo.
    #
    # Aconteceu em 13/08/2026: 5 PRs do Dependabot mesclados em ~60s geraram 5
    # deploys; o último a concluir foi o commit MAIS ANTIGO da fila (20:31:01),
    # 2s depois do HEAD. O staging serviria código 4 commits atrasado com toda a
    # CI verde — mesmo padrão de "verde que não significa nada" que já nos custou
    # caro. Segunda ocorrência: a primeira foi com 3 PRs em 13s.
    #
    # `cancel-in-progress: false` é deliberado, NÃO é conservadorismo: cancelar
    # um deploy em andamento pode matá-lo entre duas migrations do
    # `prisma migrate deploy`, deixando o banco em estado parcial. Com a fila, o
    # run em andamento termina inteiro; os pendentes intermediários o GitHub
    # descarta sozinho (mantém só o mais recente na fila), então o ÚLTIMO deploy
    # a rodar é sempre o commit mais novo — que é exatamente o que queremos.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    # Só deploya staging quando o site mudou (job "changes"); e2e-staging herda o skip via needs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true'
    env:
      STAGING_URL: ${{ secrets.STAGING_URL }}
    environment:
      name: staging
      url: ${{ env.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install -g vercel@54.6.1

      - name: Pull Vercel project config (production = staging estável)
        # staging.shareo.com.br (domínio custom) é a URL canônica usada pelos testers.
        # Deploy com --prod atualiza o deployment de produção a cada push na main
        # (e os aliases *.vercel.app como shareo-rouge — que podem ser gateados por
        # Deployment Protection; testers devem usar só o domínio custom).
        # Produção real será um projeto/domínio separado quando necessário.
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project (staging)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_STAGING }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENV: staging
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SKIP_RATE_LIMIT: "true"
          # Staging nunca pode ser indexado: o Google racharia autoridade com
          # shareo.com.br antes mesmo do go-live.
          NEXT_PUBLIC_NOINDEX: "true"

      - name: Deploy to staging (--prod → atualiza shareo-rouge.vercel.app)
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Resolve failed migrations on staging
        run: |
          pnpm prisma migrate resolve --applied 20260531000000_add_referral_fields 2>&1 || true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_STAGING }}

      - name: Run DB migrations on staging
        run: pnpm prisma generate && pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_STAGING }}

      - name: Seed staging DB (categorias + dados base)
        run: pnpm db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_STAGING }}
          NODE_ENV: staging

      - name: Post-deploy health check (staging)
        run: |
          echo "Aguardando 20s para o deploy propagar..."
          sleep 20
          # Domínio canônico (custom) — público mesmo com Deployment Protection
          # ligado (Vercel isenta domínios de produção custom). NÃO usar
          # *.vercel.app aqui: se a Vercel Authentication for ativada, essas URLs
          # passam a exigir login → o curl pega 401 e o deploy falha.
          DEPLOY_URL="https://staging.shareo.com.br"
          echo "Verificando: $DEPLOY_URL/api/health"
          RESPONSE=$(curl -s "$DEPLOY_URL/api/health")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL/api/health")
          echo "Status HTTP: $STATUS"
          echo "Response: $RESPONSE"
          if [ "$STATUS" != "200" ]; then
            echo "Health check falhou com status $STATUS"
            exit 1
          fi
          echo "Health check OK: $STATUS"

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: E2E Staging — regressão contínua após cada deploy na main
  # Roda os 12 specs curados + smoke autenticado de devolução (#36) contra o staging
  # ─────────────────────────────────────────────────────────────────
  e2e-staging:
    name: E2E Regressão Contínua (Staging)
    runs-on: ubuntu-latest
    needs: [staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      STAGING_URL: ${{ secrets.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium)
        run: pnpm exec playwright install --with-deps chromium

      # Smokes autenticados de ciclo de vida (ex.: return-flow #36) usam sessões fixture
      # (storageState) que são gitignored. Recriamos no runner: register idempotente + login.
      # continue-on-error: se falhar, os smokes que dependem das sessões apenas DÃO SKIP
      # (test.skip(!hasSessions)) — a regressão curada segue intacta, sem falso-vermelho.
      - name: Criar sessões fixture (smokes autenticados)
        continue-on-error: true
        run: pnpm tsx scripts/create-staging-fixtures.ts
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          E2E_SECRET:  ${{ secrets.E2E_SECRET }}

      # Os fixtures recém-criados nascem sem e-mail verificado / cadastro completo, o que
      # bloquearia anunciar (REGISTRATION_INCOMPLETE) e alugar (EMAIL_NOT_VERIFIED). Marcamos
      # ambos via DB para os 2 usuários de teste. continue-on-error: se falhar, o smoke dá SKIP
      # (createTestItem → 403 → test.skip), sem derrubar o deploy.
      - name: Provisionar usuários fixture (emailVerified + profileCompletedAt)
        continue-on-error: true
        run: |
          printf '%s\n' "UPDATE users SET \"emailVerified\" = COALESCE(\"emailVerified\", now()), \"profileCompletedAt\" = COALESCE(\"profileCompletedAt\", now()) WHERE email IN ('locatario.fixture@shareo-test.com','proprietario.fixture@shareo-test.com');" \
            | pnpm prisma db execute --stdin --url "$DIRECT_URL"
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL_STAGING }}

      - name: Run E2E suite against staging
        run: |
          pnpm playwright test \
            e2e/e2e-plan.spec.ts \
            e2e/e2e-auth-plan.spec.ts \
            e2e/e2e-share-plan.spec.ts \
            e2e/e2e-suite.spec.ts \
            e2e/e2e-a11y-plan.spec.ts \
            e2e/e2e-crossbrowser-plan.spec.ts \
            e2e/e2e-performance-plan.spec.ts \
            e2e/e2e-home-plan.spec.ts \
            e2e/e2e-security-plan.spec.ts \
            e2e/e2e-usability-plan.spec.ts \
            e2e/e2e-integration-plan.spec.ts \
            e2e/e2e-governance-plan.spec.ts \
            e2e/return-flow.spec.ts \
            --config=playwright.staging.config.ts --workers=1
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          # Faz o Playwright enviar o header x-e2e-token (playwright.staging.config.ts) —
          # o servidor staging (runtime) compara com E2E_SECRET e libera o bypass de
          # rate-limit nas rotas que repassam `req` (ex.: register), eliminando os 429
          # da rajada da suíte. Deve ser o MESMO valor do E2E_SECRET no Vercel staging.
          E2E_SECRET: ${{ secrets.E2E_SECRET }}

      # 🧹 Este é o ÚNICO job que roda o return-flow.spec, e é ele que cria os
      # itens "Devolução E2E …". Até 23/08/2026 o staging tinha acumulado 183
      # itens e 186 reservas, afogando as reservas reais na lista do usuário.
      #
      # O spec JÁ chama DELETE /api/items/{id} no finally, mas esse DELETE é SOFT
      # (grava deletedAt, a linha fica) e a RESERVA não é apagada por nada — não
      # existe endpoint para isso, nem deveria: reserva é registro de negócio.
      # Sem caminho por HTTP, a limpeza precisa do banco. Daí o passo ser aqui.
      #
      # 🪤 O passo nasceu no job E2E do main.yml — que NÃO roda o return-flow. Ele
      # rodava e dizia "nada a fazer" para sempre. Verificar a saída do passo, e
      # não só o verde dele, foi o que pegou o engano.
      #
      # always(): o lixo nasce mesmo quando a suíte reprova.
      # continue-on-error: faxina que falha não pode reprovar o E2E.
      - name: Limpar dados criados pelo E2E (staging)
        if: always()
        continue-on-error: true
        run: npx tsx scripts/limpar-lixo-teste-staging.ts --escopo=e2e --apply
        env:
          # Escopo `e2e` mira SÓ itens "Devolução E2E …" e o que pende deles. O
          # script aborta sozinho se algum registro financeiro depender do alvo.
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          DIRECT_URL:   ${{ secrets.DIRECT_URL_STAGING }}

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-staging-reports-${{ github.sha }}
          path: |
            e2e-*-report.json
            playwright-report-staging/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # JOB 4: Production Deploy — projeto Vercel/Supabase SEPARADO do staging
  # (shareo-prod / shareo-prd, ver ADR pendente + memória project-d4-juridico).
  # Dispara via tag web-v* (go-live público, ainda gated por D4) OU manualmente
  # (workflow_dispatch — uso interno, equipe técnica + fundadores, atrás de
  # Vercel Deployment Protection; shareo.com.br fica no placeholder até B1).
  # Para fazer deploy público real (só pós-D4): git tag web-v1.12.0 && git push origin web-v1.12.0
  # Requer aprovação no ambiente "production" do GitHub (Required reviewers)
  # ─────────────────────────────────────────────────────────────────
  production:
    name: Deploy Production
    runs-on: ubuntu-latest
    # Mesma fila do staging, por motivo mais forte: produção roda migrations no
    # banco real. Grupo PRÓPRIO — produção não deve esperar staging nem vice-versa.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Tag de release web (go-live público) OU disparo manual (teste interno)
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/web-v')) || github.event_name == 'workflow_dispatch'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install -g vercel@54.6.1

      - name: Pull Vercel project config (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}

      - name: Build project (production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PROD }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_PROD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET_PROD }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY_PROD }}
          HMAC_KEY: ${{ secrets.HMAC_KEY_PROD }}
          CRON_SECRET: ${{ secrets.CRON_SECRET_PROD }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENV: production
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          NEXT_PUBLIC_APP_URL: https://shareo-prod.vercel.app
          # SEC-CRIT-02/03 kill-switch: garante que o bypass de rate limit (SKIP_RATE_LIMIT/
          # E2E_SECRET) fica inerte em produção mesmo que um valor vaze por cópia de env.
          E2E_BYPASS_DISABLED: "true"
          NEXT_PUBLIC_NOINDEX: "false"

      - name: Deploy to production
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}

      - name: Run DB migrations on production
        run: pnpm prisma generate && pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_PROD }}

      # Health check contra a URL real do deployment (não www.shareo.com.br —
      # o domínio fica no placeholder Netlify até B1 resolver). Deployment
      # Protection do Vercel responde 302 (redirect pro login) pra requests
      # não-autenticadas — CONFIRMADO em teste real (run 31012928956, 2026-08-05)
      # — isso é ESPERADO (confirma que o acesso está restrito), não é falha.
      #
      # Enquanto shareo-prd for só uso interno, EXIGE 302/401 (proteção ativa) —
      # um 200 aqui significa que a Deployment Protection caiu (acidente, ou
      # alguém trocou pra "Standard Protection" errado) e o app ficou público
      # sem querer, o que deve quebrar o deploy, não passar silencioso. Sem
      # continue-on-error: o guard precisa valer de verdade.
      # QUANDO O D4 FECHAR E O GO-LIVE PÚBLICO FOR ATIVADO: trocar pra exigir 200.
      - name: Post-deploy health check
        run: |
          echo "Aguardando 30s para o deploy propagar..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.deploy-url }}/api/health")
          echo "Status: $STATUS (esperado: 302 ou 401 — Deployment Protection ativa, uso interno)"
          if [ "$STATUS" != "302" ] && [ "$STATUS" != "401" ]; then
            echo "Health check falhou com status $STATUS — se for 200, a Deployment Protection pode ter caído. Verifique o Vercel Dashboard."
            exit 1
          fi
