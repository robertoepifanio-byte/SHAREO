packages:
  - "apps/mobile"
  - "apps/campanha"

# pnpm 11 não lê mais o campo "pnpm" do package.json — overrides moram aqui.
overrides:
  # GHSA-23hp-3jrh-7fpw — node-tar DoS. Transitivo do expo/@expo/cli (34 caminhos),
  # dependência de build do app mobile. Remover quando o expo subir sozinho.
  tar: ">=7.5.19"
  "@shareo/mobile>@types/react": "~18.3.0"
  "@shareo/mobile>@types/react-dom": "~18.3.0"

  # ── Triagem Dependabot 2026-08-19 ──────────────────────────────────────────
  # Só cópias que alcançam runtime web / build web / dev. Trilha Expo (interno
  # do mobile) NÃO é forçada aqui (risco de quebrar o RN build) — sobe com o SDK.
  #
  # cookie: override removido — @supabase/ssr subiu p/ ^0.12.4 (SEC-MAJ-04), que
  # já puxa cookie ^1.0.2 (corrigido) nativamente. Não precisa mais forçar.
  # brace-expansion (GHSA-mh99-v99m-4gvg / GHSA-rgw5-rvv9-x895) — cópia 1.1.14
  # via minimatch@3 (eslint/jest, dev). Escopado à linha 1.x p/ não colidir com
  # as cópias 2.x/5.x (que já estão em versão corrigida).
  "brace-expansion@1": "^1.1.18"
  # sharp — cópia 0.34.5 que o next puxa p/ otimização de imagem (next/image).
  # Alinha com a dep direta 0.35.2 que já declaramos.
  sharp: "^0.35.2"
  # fast-uri (build web via ajv/webpack do @sentry + expo) — patch folha.
  fast-uri: "^3.1.5"
  # form-data (dev/test, jsdom/jest) — patch folha.
  form-data: "^4.0.6"
  # ip-address (dev, lighthouse/puppeteer) — patch folha.
  ip-address: "^10.3.1"
  # js-yaml — cópia 4.1.1 do eslint (dev). Escopado: a 3.15.1 do jest usa API v3
  # (safeLoad) e não pode ir p/ v4; a 4.3.1 do expo é interna do mobile.
  "@eslint/eslintrc>js-yaml": "^4.3.1"
  # postcss — cópia 8.4.31 que o next embute (build CSS web/campanha). Escopado
  # p/ não tocar a 8.4.49 do metro (mobile build).
  "next>postcss": "^8.5.26"

  # ── Triagem Dependabot 2026-08-20 ──────────────────────────────────────────
  # Duas folhas onde a versão CORRIGIDA já convivia no lockfile com a
  # vulnerável — alinhar é só remover a cópia velha, sem subir major nem
  # tocar na trilha do Expo.
  #
  # nanoid (GHSA-2v37-7h3g-55p8 size zero / GHSA-28wg-ghj8-5hjv size negativo)
  # — loop infinito. Cópia 3.3.15 via
  # @react-navigation/native + expo-router; a 3.3.18 (corrigida) já estava
  # presente via postcss/@react-navigation/core. Escopado ao major 3 p/ não
  # arrastar nada que venha a pedir 4.x/5.x.
  "nanoid@3": "^3.3.18"
  # brace-expansion (GHSA-v6h2-p8h4-qcjw) — cópia 5.0.6 via minimatch@10.2.5;
  # a 5.0.9 (corrigida) já vinha por minimatch@10.2.6. Escopado ao major 5:
  # a linha 1.x tem override próprio acima e a 2.x já está corrigida.
  "brace-expansion@5": "^5.0.9"

  # ── Triagem Dependabot 2026-08-20, 2ª leva ─────────────────────────────────
  # Os dois alertas restantes que TÊM patch e não exigem major. Os outros 6
  # ficam por impedimento real, não por esquecimento: image-size e extract-zip
  # não têm patch publicado; deepmerge-ts (7→8) e uuid (7→11) exigiriam major
  # dentro de @prisma/config e xcode, que sobem sozinhos.
  #
  # shell-quote (GHSA — DoS quadrático no parse()) — cópia 1.8.4 via
  # react-devtools-core, só dev. Patch de folha, sem dependente afetado.
  shell-quote: "^1.9.0"
  # postcss (4 alertas: 3/40/41/58 — leitura arbitrária de .map por
  # sourceMappingURL + XSS no stringify) — a cópia 8.4.49 vem do
  # @expo/metro-config. É a "trilha Expo" que a triagem de 19/08 evitou forçar,
  # mas aqui é minor dentro do 8.x (8.4.49 → 8.5.26, a MESMA versão que o resto
  # do repo já usa), não major. ESCOPADO ao metro-config para não tocar em mais
  # nada da árvore do Expo. Se o bundle Metro reclamar, é este override que sai.
  "@expo/metro-config>postcss": "^8.5.26"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true

pnpm:
  onlyBuiltDependencies:
    - '@prisma/client'
    - '@prisma/engines'
    - '@sentry/cli'
    - esbuild
    - msw
    - prisma
    - sharp
    - unrs-resolver
  policies:
    minimumReleaseAge: false
